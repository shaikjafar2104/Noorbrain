<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoorBrain AI</title>
  <link rel="stylesheet" href="/dashboard-static/css/sprint7-half2.css">
</head>
<body>
  <main class="ai-shell">
    <header><div><p class="eyebrow">Sprint 7</p><h1>NoorBrain Local AI</h1></div><span id="health" class="badge">Checking…</span></header>
    <section class="panel">
      <label for="question">Ask NoorBrain about saved memories</label>
      <div class="ask-row"><input id="question" placeholder="What happened in the hall today?"><button id="ask">Ask</button></div>
      <pre id="answer">Ready.</pre>
    </section>
    <section class="grid">
      <article class="panel"><h2>Memory insights</h2><div id="insights">Loading…</div></article>
      <article class="panel"><h2>Release</h2><div id="release">Loading…</div></article>
    </section>
  </main>
  <script src="/dashboard-static/js/sprint7-half2.js"></script>
</body>
</html>
